<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart School · Inicio de Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor-principal">
    <section class="tarjeta-login">
      <header class="header-login">
        <img src="logo.png" alt="Logo de Smart School: tu colegio en una sola app" class="logo">
        <h1 id="titulo-app">SMART SCHOOL</h1>
        <p class="subtitulo">TU COLEGIO EN UNA SOLA APP</p>
      </header>
      <form class="formulario-login">
        <div class="campo">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" placeholder="estudiante@colegio.edu.co" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>
      </form>
      <form action="../primera-pagina/index.html">
        <button type="submit" class="btn-login">Iniciar sesión</button>
      </form>
      <footer class="footer-login">
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
      </footer>
    </section>
  </main>
</body>
</html>
